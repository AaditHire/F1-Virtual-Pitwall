services:
  api:
    build: .
    environment:
      PITWALL_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: frontend
    environment:
      PITWALL_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
