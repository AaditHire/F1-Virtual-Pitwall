[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-virtual-pitwall"
version = "0.2.0"
description = "Cutoff-safe historical Formula 1 race replay and strategy analysis."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "F1 Virtual Pit Wall contributors" }]
dependencies = [
    "fastapi>=0.141,<1",
    "fastf1>=3.8,<4",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "defusedxml>=0.7,<1",
    "mcp>=2.1,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "pip-tools>=7.5,<8",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]
agents = [
    "openai-agents>=0.22,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1_pitwall = ["py.typed", "data/*.json"]

[project.scripts]
pitwall = "f1_pitwall.cli:main"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=f1_pitwall",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--basetemp=.pytest-tmp",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["f1_pitwall"]
omit = [
    "*/agents/advisor.py",
    "*/cli.py",
    "*/mcp_server.py",
    "*/weather/open_meteo.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "DTZ", "E", "F", "I", "N", "PERF", "PT", "RUF", "S", "SIM", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/f1_pitwall/cli.py" = ["T201"]
"scripts/*.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
